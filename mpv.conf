# General
## Profile that sets some quality settings
profile=high-quality

## Don't close mpv after finishing the video
keep-open=yes

## Save position of current video when quitting mpv
save-position-on-quit=yes

## Start mpv with a smaller window
autofit=50%

## Hide cursor in ms
cursor-autohide=100

## Select the best format that is 1080p or less
ytdl-format=bestvideo*[height<=?1080]+bestaudio/best

## Mark video as seen
ytdl-raw-options=cookies-from-browser=firefox,mark-watched=

## Disable builtin bindings
input-builtin-bindings=no

# On Screen Controller/Display
## Disable OSC
osc=no

## Still keep some of the OSD
osd-level=1

## Remove the OSD volume bar
osd-bar=no

## Remove the native window border decorations
border=no

# Screenshots
## Create PNG screenshots
screenshot-format=png

## Screenshots folder
screenshot-dir="~/Pictures/mpv"

## Screenshot filename template
screenshot-template='%F-%P-#%#00n'

## Use a lower bit depth for screenshots
screenshot-high-bit-depth=no

# Language priorities for Subtitles and Audio
alang=en,eng,enUS,en-US,English
slang=en-orig,en,eng

# Video
## Enable Hardware Acceleration
hwdec=auto

# Ignore cropping (if specified inside a .mkv file)
video-crop=0x0+0+0

# Audio
## Default volume
volume=100

## Load external audio tracks that has almost the same name as the video
audio-file-auto=fuzzy

## Only allow mpv to output audio when playing
audio-exclusive=yes

# Subtitles
## Use Cabin Font
sub-ass-override=no
sub-ass-style-overrides=playresx=1920,playresy=1080
sub-font="Cabin"
sub-font-size=50
sub-color="#FFFFFFFF"
sub-margin-y=40
sub-border-size=2.4
sub-border-color="#FF000000"
sub-shadow-color="#A0000000"
sub-shadow-offset=0.8
sub-ass-style-overrides=Kerning=yes

# Images
## don't stop displaying images after 1 second
image-display-duration=inf
## reset zoom, alignment and rotation between images
reset-on-next-file=video-zoom,panscan,video-unscaled,video-align-x,video-align-y,video-rotate

# Show status after loading a new file
osd-playing-msg=${!playlist-count==1:[${playlist-pos-1}/${playlist-count}] }${media-title} ${?width:${width}x${height}} ${?current-tracks/video/image==no:${?percent-pos==0:${duration}}${!percent-pos==0:${time-pos} / ${duration} (${percent-pos}%)}}
osd-playing-msg-duration=7000

# On most platforms you can make the background transparent and avoid black
# bars while still having all the screen space available for zooming in:
background=none
background-color=0/0

# HDR
target-colorspace-hint=yes
target-contrast=auto

# Profiles
[dont-log]
profile-cond=(function() local ignored, path = {"games"}, get("path", "") path = ((path:find("^%a[%w.+-]-://") or path:find("^%a[%w.+-]-:%?")) and path:lower() or require "mp.utils".join_path(get("working-directory", ""), path)):sub(1, -get("filename", ""):len()-1):lower() for _, ig in ipairs(ignored) do if path:find(ig:lower(), 1, true) then return true end end end)()
profile-restore=copy-equal
script-opts-append=memo-enabled=no

[image]
# Set options for stand-alone images (not cover art).
# The condition is written not to restore and reapply the options on each image
# because that is inefficient, especially for toggling --d3d11-flip which
# reinits the VO.
# current-tracks/video is observed instead of current-tracks/video/image and
# current-tracks/video/albumart to prevent a very rare race condition that
# applies the profile to music with cover art.
profile-cond="(get('current-tracks/video', {}).image and not get('current-tracks/video', {}).albumart) or (not get('current-tracks/video') and get('user-data/mpv/image'))"
profile-restore=copy
# enable the image-only bindings in input.conf.
input-commands-append=no-osd set user-data/mpv/image 1; enable-section image allow-hide-cursor+allow-vo-dragging
# enable background transparency if on d3d11/Windows
d3d11-flip=no
# recenter after zooming out
video-recenter=yes
# pan diagonally with a touchpad
input-preprocess-wheel=no
# don't show a full green progress in Windows' taskbar
taskbar-progress=no

[non-image]
profile-cond="get('user-data/mpv/image') and (not get('current-tracks/video', {image = true}).image or get('current-tracks/audio'))"
input-commands=no-osd del user-data/mpv/image; disable-section image # disable image key bindings

[loop-short]
profile-cond="duration < 30 and p['current-tracks/video/image'] == false"
profile-restore=copy
loop-file=yes
